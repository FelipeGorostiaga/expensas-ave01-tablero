<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expensas AVE 01</title>
<meta name="description" content="Tablero de control de las liquidaciones de expensas del Fideicomiso AVE 01: gastos, morosidad, caja y controles de la administración.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('expensas-tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
/* ---------- tokens: oscuro por defecto, claro según el sistema o el botón de tema ---------- */
:root{
  color-scheme:dark;
  --bg:#0f0f0e; --surface:#181816; --surface-2:#222120; --line:#2b2a27; --line-2:#3d3c38;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86; --inv-muted:#55534e;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --cx:#6b6a65;
  --up:#e66767; --down:#3987e5; --neutral:#6b6a65;
  --good-bg:rgba(12,163,12,.16); --good-ink:#2fbf2f; --warn-bg:rgba(250,178,25,.15); --warn-ink:#fab219;
  --serious-bg:rgba(236,131,90,.16); --serious-ink:#ef9672; --bad-bg:rgba(208,59,59,.22); --bad-ink:#f07a7a;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f4f3ef; --surface:#fdfcfa; --surface-2:#f0eee8; --line:#e3e1da; --line-2:#cdcac1;
    --ink:#141412; --ink-2:#4a4844; --muted:#6c6a64; --inv-muted:#b3b1aa;
    --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --cx:#b3b1aa;
    --up:#e34948; --down:#2a78d6; --neutral:#a9a7a0;
    --good-bg:rgba(12,163,12,.12); --good-ink:#006300; --warn-bg:rgba(250,178,25,.22); --warn-ink:#7f5300;
    --serious-bg:rgba(236,131,90,.18); --serious-ink:#9c3d17; --bad-bg:rgba(208,59,59,.13); --bad-ink:#b02a2a;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f3ef; --surface:#fdfcfa; --surface-2:#f0eee8; --line:#e3e1da; --line-2:#cdcac1;
  --ink:#141412; --ink-2:#4a4844; --muted:#6c6a64; --inv-muted:#b3b1aa;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --cx:#b3b1aa;
  --up:#e34948; --down:#2a78d6; --neutral:#a9a7a0;
  --good-bg:rgba(12,163,12,.12); --good-ink:#006300; --warn-bg:rgba(250,178,25,.22); --warn-ink:#7f5300;
  --serious-bg:rgba(236,131,90,.18); --serious-ink:#9c3d17; --bad-bg:rgba(208,59,59,.13); --bad-ink:#b02a2a;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
a{color:var(--ink-2)} a:hover{color:var(--ink)}
.disp{font-weight:600;letter-spacing:-0.035em;line-height:1.02}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .b{font-weight:600;color:var(--ink)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ln{fill:none;stroke-width:2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.good{color:var(--good-ink)} .bad{color:var(--bad-ink)} .warn{color:var(--warn-ink)}

/* ---------- estructura ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:32px clamp(16px,4vw,40px) 72px;display:flex;flex-direction:column;gap:28px}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.row.stretch{align-items:stretch}
.col-stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{display:flex;flex-direction:column;gap:16px;min-width:0;padding:clamp(16px,2.2vw,24px);background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-h{display:flex;flex-direction:column;gap:6px}
.card-h.split{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
h2{font-size:22px;font-weight:600;letter-spacing:-0.035em;line-height:1.1}
h3{font-size:15px;font-weight:600}
.sub{font-size:13px;color:var(--ink-2);max-width:74ch;text-wrap:pretty}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:12px;color:var(--muted);text-wrap:pretty}
.empty{padding:18px;border:1px dashed var(--line-2);border-radius:12px;color:var(--ink-2);font-size:13px}

/* ---------- encabezado ---------- */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
header.top .who{display:flex;flex-direction:column;gap:10px;min-width:0}
header.top h1{font-size:40px;font-weight:600;letter-spacing:-0.035em;line-height:1.02}
header.top .right{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.pill-btn{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 16px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);transition:background-color .15s ease,border-color .15s ease}
.pill-btn:hover,.round-btn:hover{background:var(--surface-2)}
.round-btn{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);transition:background-color .15s ease}

/* ---------- selector de mes ---------- */
.sel-wide{display:flex;flex-direction:column;gap:12px;padding:18px 24px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sel-narrow{display:none;flex-direction:column;gap:10px;padding:14px 12px 8px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;font-size:13px;color:var(--ink-2)}
.sel-read{display:flex;align-items:baseline;gap:10px}
.sel-read .v{font-size:20px;font-weight:600;color:var(--ink)}
.sel-plot{position:relative}
.sel-chart{position:absolute;left:0;right:0;top:0;height:104px}
.sel-chart svg{position:absolute;inset:0;width:100%;height:100%}
.sel-chart .rule{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.sel-chart .dot{position:absolute;border-radius:50%;box-shadow:0 0 0 3px var(--surface)}
.sel-cols{position:relative;display:grid}
.sel-cols button{display:flex;flex-direction:column;align-items:center;gap:1px;padding-bottom:8px;border-radius:10px;min-width:0;transition:background-color .15s ease}
.sel-cols button:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.sel-cols button[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.sel-cols .sp{display:block;height:110px}
.sel-cols .m{font-size:13px;color:var(--ink-2)} .sel-cols .t{font-size:12px;color:var(--muted)} .sel-cols .d{font-size:11px}
.sel-cols button[aria-pressed="true"] .m,.sel-cols button[aria-pressed="true"] .t{font-weight:600;color:var(--ink)}
.step-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step-mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center}
.step-track{position:relative}
.step-track .tr{position:absolute;top:13px;height:2px;background:var(--line-2)}
.step-track .fill{background:var(--muted)}
.step-dots{position:relative;display:grid}
.step-dots button{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:48px;padding-top:7px;font-size:11px;color:var(--muted)}
.step-dots .dw{display:grid;place-items:center;height:14px}
.step-dots .dt{display:block;border-radius:50%;box-shadow:0 0 0 3px var(--surface)}
.step-dots button[aria-pressed="true"]{font-weight:600;color:var(--ink)}

/* ---------- pestañas ---------- */
nav.tabs{margin-top:-4px;overflow-y:hidden}
nav.tabs>div{display:flex;gap:4px;min-width:max-content;border-bottom:1px solid var(--line)}
.tab{display:flex;flex-direction:column;gap:2px;padding:12px 16px 14px;min-height:44px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab .l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--ink-2)}
.tab .q{font-size:12px;color:var(--muted)}
.tab:hover .l{color:var(--ink)}
.tab[aria-current="page"]{border-bottom-color:var(--ink)} .tab[aria-current="page"] .l{color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);font-size:11px;font-weight:700}

/* ---------- piezas ---------- */
.hero{flex:2 1 520px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8px 0}
.hero-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.hero-num{font-size:79px}
.hero p{font-size:14px;color:var(--ink-2);max-width:62ch;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.hchip strong{font-weight:600;color:var(--ink)}
.fchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;color:var(--ink-2);white-space:nowrap;transition:background-color .15s ease,border-color .15s ease}
.fchip:hover{border-color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.fchip .sw{width:10px;height:10px;border-radius:3px}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.st.good{background:var(--good-bg);color:var(--good-ink)} .st.warn{background:var(--warn-bg);color:var(--warn-ink)}
.st.serious{background:var(--serious-bg);color:var(--serious-ink)} .st.bad{background:var(--bad-bg);color:var(--bad-ink)}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--ink)}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px}
.kpi{display:flex;flex-direction:column;gap:10px;min-width:0;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;transition:background-color .15s ease,border-color .15s ease}
button.kpi:hover{border-color:var(--line-2);background:var(--surface-2)}
.kpi .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.kpi .v{font-size:29px}
.kpi .foot{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--muted)}
.spark{position:relative;display:block;height:34px;margin-top:2px}
.spark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spark .pt{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}

/* gráfico de columnas */
.cc{display:flex;gap:10px}
.cc-y{position:relative;flex:none;width:52px}
.cc-y span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--muted);white-space:nowrap}
.cc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.cc-plot{position:relative}
.cc-plot .g{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.cc-cols{position:absolute;inset:0;display:flex;align-items:stretch;gap:10px}
.cc-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-radius:8px 8px 0 0}
.cc-col[aria-pressed="true"]{background:var(--surface-2)}
.cc-col:hover .stk{filter:brightness(1.18)}
.cc-col .lb{font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap}
.stk{display:flex;flex-direction:column-reverse;gap:2px;width:62%;max-width:56px}
.stk.pair{flex-direction:row;align-items:flex-end;gap:3px;width:78%;max-width:72px}
.stk.pair span{flex:1 1 0}
.stk span{display:block}
.cc-x{display:flex;gap:10px}
.cc-x span{flex:1 1 0;min-width:0;text-align:center;font-size:12px;color:var(--muted)}
.cc-x span.on{color:var(--ink);font-weight:600}
.cc-x small{display:block;font-size:11px}

/* filas con barra */
.brow{display:grid;gap:12px;align-items:center;min-height:32px}
.bar-track{position:relative;height:16px}
.bar-track .zero{position:absolute;top:-8px;bottom:-8px;width:1px;background:var(--line-2)}
.bar-track .bar{position:absolute;top:0;height:100%;min-width:2px;border-radius:3px}
.prow{display:grid;gap:12px;align-items:center;min-height:48px;padding:8px;border-radius:8px;text-align:left;width:100%;transition:background-color .15s ease}
button.prow:hover,.prow.sel{background:var(--surface-2)}
.thin{display:block;height:4px;border-radius:2px;background:var(--line)}
.thin i{display:block;height:100%;border-radius:2px}

/* tablas */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface);padding:8px;font-size:12px;font-weight:500;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);z-index:1}
.tbl th.sortable{cursor:pointer;user-select:none} .tbl th.sortable:hover{color:var(--ink)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.tbl td.wrap-c{white-space:normal;min-width:220px}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:var(--surface-2)}
.tbl td.selc,.tbl th.selc{background:var(--surface-2)}
.tbl tbody tr.click{cursor:pointer} .tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--line-2)}
.tbl-box{overflow:auto;scrollbar-width:thin}
details.more{border-top:1px solid var(--line);padding-top:6px}
details.more>summary{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;font-weight:600;cursor:pointer;list-style:none;color:var(--ink)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .ic{transition:transform .15s ease}
details.more[open]>summary .ic{transform:rotate(180deg)}
details.more>summary .hint{font-weight:400;color:var(--muted)}
details.more>.body{display:flex;flex-direction:column;gap:12px;padding:6px 0 4px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--bg);color:var(--muted);flex:1 1 260px;min-width:0}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel-native{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:12px;color:var(--muted)} .kv .v{font-weight:600}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);max-width:72ch}
.callout .tile,.alert .tile{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;flex:none}
.tile.good{background:var(--good-bg);color:var(--good-ink)} .tile.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tile.serious{background:var(--serious-bg);color:var(--serious-ink)} .tile.bad{background:var(--bad-bg);color:var(--bad-ink)} .tile.neutral{background:var(--surface-2);color:var(--ink-2)}
.alert{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;width:100%;transition:border-color .15s ease}
button.alert:hover{border-color:var(--ink-2)}
.alert .tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.alert .tt b{font-weight:600;font-size:14px}
.alert .lvl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.alert .d{font-size:13px;color:var(--ink-2);text-wrap:pretty}
.alert .go{font-size:12px;color:var(--muted)}
.lvl.good{color:var(--good-ink)} .lvl.warn{color:var(--warn-ink)} .lvl.serious{color:var(--serious-ink)} .lvl.bad{color:var(--bad-ink)} .lvl.neutral{color:var(--ink-2)}

.nlist{display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--ink-2)}
.nlist>div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.nlist>div>*{min-width:0}

/* mapa de pagos */
.hm td{padding:3px;text-align:center}
.hm td:first-child{text-align:left;padding:3px 8px}
.hm td.r{text-align:right;padding:3px 8px}
.hc{display:grid;place-items:center;width:100%;min-width:34px;height:30px;border-radius:6px;flex:none}
.hc.paid{background:var(--good-bg);color:var(--good-ink)} .hc.partial{background:var(--warn-bg);color:var(--warn-ink)} .hc.unpaid{background:var(--bad-bg);color:var(--bad-ink)} .hc.none{border:1px dashed var(--line-2)}
.hm td.hsel,.hm th.hsel{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink);color:var(--ink)}
.hm thead th.hsel{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}
.hm tbody tr:last-child td.hsel{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;max-width:320px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2)}
.tip .r .k{display:inline-flex;align-items:center;gap:6px}
.tip .r .v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.tip .r.total{margin-top:4px;padding-top:4px;border-top:1px solid var(--line-2);font-weight:600}

/* diálogo de unidad */
dialog.dlg{width:min(560px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 48px));padding:0;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);color:var(--ink)}
dialog.dlg::backdrop{background:rgba(0,0,0,.55)}
.dlg-in{display:flex;flex-direction:column;gap:14px;padding:20px;max-height:inherit}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.uf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;overflow:auto;padding:2px}
.uf-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:4px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:13px}
.uf-grid button small{font-weight:400;font-size:11px;color:var(--muted)}
.uf-grid button:hover{border-color:var(--ink-2)}
.uf-grid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)} .uf-grid button[aria-pressed="true"] small{color:var(--inv-muted)}

/* clave */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg)}
.gate-card{display:flex;flex-direction:column;gap:12px;width:min(400px,100%);padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.gate-card h1{font-size:26px;font-weight:600;letter-spacing:-0.035em;line-height:1.1}
.gate-card p{color:var(--ink-2);margin:0 0 6px}
.gate-card label{font-size:12px;color:var(--muted)}
.gate-field{position:relative;display:flex}
.gate-card input{font-size:16px;height:44px;padding:0 44px 0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.gate-card .gate-eye{position:absolute;right:0;top:0;bottom:0;width:44px;display:grid;place-items:center;color:var(--muted)}
.gate-card .gate-eye svg{display:block}
.gate-card .gate-eye[aria-pressed="true"] .eye-closed{display:none}
.gate-card .gate-eye:hover,.gate-card .gate-eye[aria-pressed="true"]{color:var(--ink)}
.gate-card button[type="submit"]{height:44px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center}
.gate-card button:disabled{opacity:.6;cursor:wait}
.gate-err{color:var(--bad-ink);font-size:13px;min-height:1.2em}

footer.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
@media (max-width:720px){
  .hide-sm{display:none!important}
  .hero-num{font-size:60px}
  .sel-wide{display:none}
  .sel-narrow{display:flex}
  header.top h1{font-size:32px}
  .cc{gap:6px} .cc-cols,.cc-x{gap:4px} .cc-y{width:44px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
function bootDashboard(){
'use strict';
const D = window.EXPENSAS; if(!D) return;
const M = D.months.slice().sort((a,b)=>a.period<b.period?-1:1);
const P = M.map(m=>m.period); const N = P.length; const LAST = M[N-1];
const MON = {'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};
const MONL = {'01':'enero','02':'febrero','03':'marzo','04':'abril','05':'mayo','06':'junio','07':'julio','08':'agosto','09':'septiembre','10':'octubre','11':'noviembre','12':'diciembre'};
const lab = p => MON[p.slice(5)];                       // Feb
const labS = p => MON[p.slice(5)].toLowerCase();        // feb
const labM = p => MONL[p.slice(5)];                     // febrero
const labL = p => MONL[p.slice(5)] + ' ' + p.slice(0,4); // febrero 2026
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- formato (es-AR) ----------
const MINUS = '−';
const nf0 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:0, useGrouping:'always'});
const nf1 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:1, minimumFractionDigits:1, useGrouping:'always'});
const nf2 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:2, minimumFractionDigits:2});
const fm = v => { const a = Math.abs(v), s = v<0? MINUS : ''; if(a>=1e6) return s+'$ '+nf1.format(a/1e6)+' M'; if(a>=1e3) return s+'$ '+nf0.format(a/1e3)+' mil'; return s+'$ '+nf0.format(a); };
const fp = v => (v<=-0.5? MINUS : '') + '$ ' + nf0.format(Math.abs(Math.round(v)));
const sm = v => (v>=0? '+' : MINUS) + fm(Math.abs(v));
const pc = (v, signed=true) => (v==null||!isFinite(v))? '—' : (v<0? MINUS : (signed&&v>0? '+' : '')) + nf1.format(Math.abs(v)*100) + ' %';
const pp = v => (v<0? MINUS : '+') + nf1.format(Math.abs(v)*100) + ' pp';
const tickL = v => v===0? '$ 0' : fm(v).replace(',0 M',' M');
const sum = a => a.reduce((x,y)=>x+(y||0),0);
const chg = (cur, prev) => (prev==null || !isFinite(prev) || Math.abs(prev)<0.5 || cur==null)? null : cur/prev-1;
const dcol = (v, upBad=true) => (v==null||Math.abs(v)<0.002)? 'var(--ink-2)' : ((v>0)===upBad? 'var(--bad-ink)' : 'var(--good-ink)');

// ---------- DOM ----------
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){ const e = document.createElement(tag); if(attrs) for(const k in attrs){ const v = attrs[k]; if(v==null || v===false) continue; if(k==='class') e.className = v; else if(k==='text') e.textContent = v; else if(k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v===true? '' : v); } for(const k of kids.flat(Infinity)){ if(k==null || k===false) continue; e.append(k.nodeType? k : document.createTextNode(String(k))); } return e; }
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
const ICON = { chev:'M4 6l4 4 4-4', left:'M10 4l-4 4 4 4', right:'M6 4l4 4-4 4', arrow:'M3 8h10M9 4l4 4-4 4', check:'M3.5 8.5l3 3 6-7', dash:'M4.5 8h7', x:'M5 5l6 6M11 5l-6 6',
  search:'M7 12.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11Z M11 11l3.5 3.5', copy:'M5.5 5.5V3.2c0-.4.3-.7.7-.7h6.6c.4 0 .7.3.7.7v6.6c0 .4-.3.7-.7.7h-2.3 M3.2 5.5h6.6c.4 0 .7.3.7.7v6.6c0 .4-.3.7-.7.7H3.2c-.4 0-.7-.3-.7-.7V6.2c0-.4.3-.7.7-.7Z',
  alert:'M8 2.6l5.8 10.2H2.2L8 2.6Z M8 6.6v3 M8 11.5v.1', info:'M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12Z M8 7.4v3.4 M8 5.2v.1',
  sun:'M8 10.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z M8 1.8v1.4 M8 12.8v1.4 M1.8 8h1.4 M12.8 8h1.4 M3.6 3.6l1 1 M11.4 11.4l1 1 M3.6 12.4l1-1 M11.4 4.6l1-1', moon:'M13 9.4A5.5 5.5 0 0 1 6.6 3 5.5 5.5 0 1 0 13 9.4Z' };
function ic(name, size=16){ const g = s('svg',{class:'ic', viewBox:'0 0 16 16', width:size, height:size, 'aria-hidden':'true'}); s('path',{d:ICON[name]}, g); return g; }
const KIND = { good:{l:'OK', c:'good', i:'check'}, warn:{l:'Revisar', c:'warn', i:'alert'}, serious:{l:'Atención', c:'serious', i:'alert'}, critical:{l:'Falla', c:'bad', i:'x'}, neutral:{l:'Info', c:'neutral', i:'info'} };
const st = (cls, text) => h('span',{class:'st '+cls, text});
const tag = text => h('span',{class:'st', text});
const sw = color => h('span',{class:'sw', style:'background:'+color});
const strong = text => h('strong',{class:'b', text});
// variación coloreada con etiqueta: "+2,5 % vs. sep"
function dnode(cur, prev, upBad=true, label=''){ const v = chg(cur, prev); if(v==null) return h('span',{class:'muted', text: label? 'sin dato '+label : ''}); return h('span',{}, h('span',{class:'num', style:'font-weight:600;color:'+dcol(v, upBad), text:pc(v)}), label? h('span',{class:'muted', text:' '+label}) : null); }
function cardHead(title, sub, right){ const l = h('div',{class:'card-h'}, h('h2',{text:title}), sub? h('p',{class:'sub'}, sub) : null); return right? h('div',{class:'card-h split'}, l, right) : l; }
function card(title, sub, ...kids){ return h('section',{class:'card'}, cardHead(title, sub), ...kids); }
function linkBtn(text, onclick){ return h('button',{class:'lnk', onclick}, text, ic('arrow')); }
function legend(items){ return h('div',{class:'legend'}, items.map(it=>h('span',{}, sw(it.c), it.n))); }

// tooltip
const tip = $('tip');
function showTip(x, y, title, rows, total){ tip.replaceChildren(); if(title) tip.append(h('div',{class:'t',text:title})); for(const r of rows){ tip.append(h('div',{class:'r'}, h('span',{class:'k'}, r.color? sw(r.color) : null, r.label), h('span',{class:'v',text:r.value}))); } if(total) tip.append(h('div',{class:'r total'}, h('span',{class:'k',text:total.label}), h('span',{class:'v',text:total.value}))); tip.hidden = false; const w = tip.offsetWidth, hh = tip.offsetHeight; let px = x+14, py = y+14; if(px+w>window.innerWidth-8) px = Math.max(8, x-14-w); if(py+hh>window.innerHeight-8) py = Math.max(8, y-14-hh); tip.style.left = px+'px'; tip.style.top = py+'px'; }
function hideTip(){ tip.hidden = true; }
function tipOn(el, title, rowsFn){ const show = ev => { const r = el.getBoundingClientRect(); showTip(ev.clientX!=null && ev.type!=='focus'? ev.clientX : r.left+r.width/2, ev.clientY!=null && ev.type!=='focus'? ev.clientY : r.bottom, typeof title==='function'? title() : title, rowsFn()); }; el.addEventListener('pointermove', show); el.addEventListener('focus', show); el.addEventListener('pointerleave', hideTip); el.addEventListener('blur', hideTip); }

// ---------- escalas ----------
function niceStep(range, n){ const raw = range/n; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw/p; const nice = f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return nice*p; }
function ticks(max, n=4){ if(!(max>0)) max = 1; const stp = niceStep(max, n); const hi = Math.ceil(max/stp - 1e-9)*stp; const t = []; for(let v=0; v<=hi+stp/2; v+=stp) t.push(Math.round(v*1e6)/1e6); return {hi, t}; }

// ---------- gráficos ----------
// columnas apiladas (o apareadas) por mes; cada columna es un botón que elige el mes
function colChart(o){
  const H = o.height||240, series = o.series, pair = !!o.pair;
  const totals_ = P.map((_,i)=> pair? Math.max(...series.map(sr=>sr.values[i]||0)) : sum(series.map(sr=>Math.max(0, sr.values[i]||0))));
  const {hi, t} = ticks(o.max || Math.max(...totals_), o.nTicks||4);
  const fmt = o.fmt || fm, tf = o.tickFmt || tickL;
  const y = h('div',{class:'cc-y', style:`height:${H}px`, 'aria-hidden':'true'}, t.map(v=>h('span',{class:'num', style:`bottom:${v/hi*H}px`, text:tf(v)})));
  const plot = h('div',{class:'cc-plot', style:`height:${H}px`}, t.map(v=>h('span',{class:'g', style:`bottom:${v/hi*H}px`})));
  const cols = h('div',{class:'cc-cols'});
  const avail = H - 22;
  P.forEach((p,i)=>{
    const on = i===MI; const segs = series.map(sr=>({sr, v: Math.max(0, sr.values[i]||0)})).filter(x=>x.v>0);
    const stk = h('span',{class:'stk'+(pair?' pair':'')});
    if(pair) series.forEach(sr=>{ const v = Math.max(0, sr.values[i]||0); stk.append(h('span',{style:`height:${Math.max(v>0?2:0, v/hi*avail)}px;background:${sr.color};border-radius:4px 4px 0 0`})); });
    else segs.forEach((x,k)=>{ const px = Math.max(1, x.v/hi*avail - (k<segs.length-1? 2 : 0)); stk.append(h('span',{style:`height:${px}px;background:${x.sr.color};border-radius:${k===segs.length-1?'4px 4px 0 0':'0'}`})); });
    const showLb = !pair && (o.labelAll || on) && totals_[i]>0;
    const b = h('button',{class:'cc-col', 'aria-pressed': on? 'true':'false', 'aria-label': `${labL(p)}: ${fmt(totals_[i])}${i? ', '+pc(chg(totals_[i], totals_[i-1]))+' contra '+labM(P[i-1]) : ''}`, onclick:()=>setMonth(i)}, showLb? h('span',{class:'lb num', text:(o.lbFmt||fmt)(totals_[i])}) : null, stk);
    if(o.onHover){ b.addEventListener('pointerenter', ()=>o.onHover(i)); b.addEventListener('focus', ()=>o.onHover(i)); b.addEventListener('pointerleave', ()=>o.onHover(null)); b.addEventListener('blur', ()=>o.onHover(null)); }
    else tipOn(b, labL(p), ()=>series.map(sr=>({label:sr.name, value:fmt(sr.values[i]||0), color:sr.color})).filter((r,k)=>(series[k].values[i]||0)!==0).reverse().concat(!pair && series.length>1? [{label:'Total', value:fmt(totals_[i])}] : []));
    cols.append(b);
  });
  plot.append(cols);
  const x = h('div',{class:'cc-x', 'aria-hidden':'true'}, P.map((p,i)=>h('span',{class: i===MI?'on':''}, lab(p), o.under? h('small',{class:'num', text:o.under(i)}) : null)));
  return h('div',{class:'cc'}, y, h('div',{class:'cc-main'}, plot, x));
}
function sparkPath(vals, W=100, H=32, pad=3){ const def = vals.filter(v=>v!=null); if(!def.length) return {d:'', pt:()=>null}; const mn = Math.min(...def), mx = Math.max(...def); const sx = i => vals.length<2? W/2 : i*W/(vals.length-1); const sy = v => mx===mn? H/2 : H-pad-(v-mn)/(mx-mn)*(H-2*pad); let d = '', prev = false; vals.forEach((v,i)=>{ if(v==null){ prev = false; return; } d += (prev?'L':'M')+sx(i).toFixed(1)+','+sy(v).toFixed(1); prev = true; }); return {d, pt:i=>vals[i]==null? null : {x:sx(i)/W*100, y:sy(vals[i])/H*100}}; }
function spark(vals, mark){ const sp = sparkPath(vals); const svg = s('svg',{viewBox:'0 0 100 32', preserveAspectRatio:'none', 'aria-hidden':'true'}); s('path',{class:'ln', d:sp.d, style:'stroke:var(--ink-2)'}, svg); const pt = sp.pt(mark); return h('span',{class:'spark'}, svg, pt? h('span',{class:'pt', style:`left:${pt.x}%;top:${pt.y}%`}) : null); }
function miniBars(vals, mark, height=44){ const mx = Math.max(...vals.map(v=>v||0), 1); return h('div',{style:`display:flex;align-items:flex-end;gap:4px;height:${height}px`, 'aria-hidden':'true'}, vals.map((v,i)=> v==null? h('span',{style:`flex:1 1 0;height:${height*0.5}px;border:1px dashed var(--line-2);border-bottom:0;border-radius:3px 3px 0 0`}) : h('span',{style:`flex:1 1 0;height:${Math.max(2,(v||0)/mx*height)}px;border-radius:3px 3px 0 0;background:${i===mark?'var(--ink)':'var(--line-2)'}`}))); }

// tabla ordenable genérica
function table(cols, rows, opts={}){
  let sortKey = opts.sortKey||null, sortDir = opts.sortDir||-1;
  const tbl = h('table',{class:'tbl'}); const thead = h('thead'); const tbody = h('tbody'); tbl.append(thead, tbody);
  function render(){ thead.replaceChildren(); const tr = h('tr'); cols.forEach(c=>{ const th = h('th',{class:(c.num?'r ':'')+(opts.noSort?'':'sortable ')+(c.cls||''), scope:'col'}, c.label, c.key===sortKey? (sortDir<0?' ▾':' ▴') : null); if(!opts.noSort) th.addEventListener('click', ()=>{ if(sortKey===c.key) sortDir = -sortDir; else { sortKey = c.key; sortDir = c.num?-1:1; } render(); }); tr.append(th); }); thead.append(tr);
    let rs = rows.slice(); if(sortKey){ const c = cols.find(c=>c.key===sortKey); if(c) rs.sort((a,b)=>{ const va = c.sortVal? c.sortVal(a) : a[sortKey], vb = c.sortVal? c.sortVal(b) : b[sortKey]; if(va==null && vb==null) return 0; if(va==null) return 1; if(vb==null) return -1; return (va<vb?-1:va>vb?1:0)*sortDir; }); }
    tbody.replaceChildren(); rs.forEach(r=>{ const tr = h('tr',{class:(opts.onSelect?'click ':'')+(opts.rowClass? opts.rowClass(r) : '')}); cols.forEach(c=>{ const td = h('td',{class:(c.num?'r ':'')+(c.wrap?'wrap-c ':'')+(c.cls||'')}); const v = c.render? c.render(r) : (c.fmt? (r[c.key]==null? null : c.fmt(r[c.key])) : r[c.key]); if(v==null || v==='') td.append(h('span',{class:'muted',text:'—'})); else td.append(...[v].flat(Infinity).filter(x=>x!=null&&x!==false).map(x=>x.nodeType? x : String(x))); tr.append(td); });
      if(opts.onSelect){ tr.tabIndex = 0; const sel = ()=>opts.onSelect(r); tr.addEventListener('click', sel); tr.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sel(); } }); }
      tbody.append(tr); });
    if(!rs.length) tbody.append(h('tr',{}, h('td',{colspan:cols.length, class:'muted', text: opts.empty||'Sin datos.'})));
  }
  render();
  if(opts.footer){ const tf = h('tfoot'); const tr = h('tr'); cols.forEach(c=>{ const td = h('td',{class:c.num?'r':''}); const v = opts.footer[c.key]; if(v!=null) td.append(v.nodeType? v : String(v)); tr.append(td); }); tf.append(tr); tbl.append(tf); }
  return h('div',{class:'tbl-box', style: opts.maxHeight? `max-height:${opts.maxHeight}px` : ''}, tbl);
}
// sección plegable "Ver tabla completa": se arma al abrir y recuerda si quedó abierta
const OPEN = new Set();
function more(id, title, hint, build){ const d = h('details',{class:'more'}); const body = h('div',{class:'body'}); let built = false; const fill = ()=>{ if(built) return; built = true; body.append(...[build()].flat(Infinity).filter(Boolean)); }; d.append(h('summary',{}, ic('chev'), title, hint? h('span',{class:'hint', text:hint}) : null), body); if(OPEN.has(id)){ d.open = true; fill(); } d.addEventListener('toggle', ()=>{ if(d.open){ OPEN.add(id); fill(); } else OPEN.delete(id); }); return d; }

// ---------- análisis (misma lógica que la versión anterior) ----------
const RUBROS = [
  {k:'abonos', n:'Abonos de servicios', note:'seguridad, ascensores y otros abonos', c:'var(--c1)'},
  {k:'servicios', n:'Servicios públicos', note:'luz, gas, agua y ABL', c:'var(--c2)'},
  {k:'bancarios', n:'Gastos bancarios', note:'incluye retenciones de Ingresos Brutos', c:'var(--c3)'},
  {k:'mant', n:'Mantenimiento', note:'partes comunes', c:'var(--c4)'},
  {k:'admin', n:'Administración', note:'honorarios', c:'var(--c5)'},
  {k:'seguros', n:'Seguros', note:'pagos del período', c:'var(--c6)'},
  {k:'otros', n:'Otros', note:'incluye limpieza y reparaciones', c:'var(--cx)'}];
const RUBRO_FOLD = {'SERVICIOS PÚBLICOS':'Servicios públicos','ABONOS DE SERVICIOS':'Abonos de servicios','MANTENIMIENTO DE PARTES COMUNES':'Mantenimiento','GASTOS BANCARIOS':'Gastos bancarios','GASTOS DE ADMINISTRACIÓN':'Administración','PAGOS DEL PERIODO POR SEGUROS':'Seguros'};
const foldRubro = r => RUBRO_FOLD[r] || 'Otros';
const rubroColor = n => (RUBROS.find(r=>r.n===n)||{c:'var(--neutral)'}).c;
const rubroSeries = RUBROS.map(r=>({k:r.k, name:r.n, note:r.note, color:r.c, values: M.map(m=>sum(m.rubro_totals.filter(rt=>foldRubro(rt.rubro)===r.n).map(rt=>rt.total)))}));
const totals = M.map(m=>m.grand_total.total);

// matriz proveedor / concepto (neta de previsiones y reintegros)
const isNetItem = it => !(it.is_provision || it.is_reversal);
const groups = {};
M.forEach((m,i)=> m.items.forEach(it=>{ const g = groups[it.group] || (groups[it.group] = {name:it.group, provider:it.provider, cuit:null, values:Array(N).fill(0), gross:Array(N).fill(0), items:[], rubros:new Set()}); if(isNetItem(it)) g.values[i] += it.total; g.gross[i] += it.total; g.items.push(Object.assign({period:m.period, mi:i}, it)); g.rubros.add(foldRubro(it.rubro)); if(it.cuit) g.cuit = it.cuit; }));

// qué movió el gasto entre el mes anterior y el elegido
function drivers(mi){
  const pi = mi-1; const note = g => { if(g.first===mi) return 'nuevo'; if(g.values[mi]===0) return 'no facturó este mes'; if(g.active<=2) return 'gasto puntual'; if(g.values[pi]===0) return `no había facturado en ${labM(P[pi])}`; if(g.name==='Gastos bancarios') return 'incluye retenciones de Ingresos Brutos'; return ''; };
  const ch = G.map(g=>({l:g.name, d:g.values[mi]-g.values[pi], note:note(g)})).filter(x=>Math.abs(x.d)>0.5);
  const ups = ch.filter(x=>x.d>0).sort((a,b)=>b.d-a.d), downs = ch.filter(x=>x.d<0).sort((a,b)=>a.d-b.d);
  const rest = (arr, n, label) => { const r = arr.slice(n); if(!r.length) return []; return [{l:label, d:sum(r.map(x=>x.d)), note: r.slice(0,3).map(x=>x.l).join(', ') + (r.length>3? ` y ${r.length-3} más` : ''), agg:true}]; };
  const out = [...ups.slice(0,6), ...rest(ups, 6, 'Otras subas'), ...downs.slice(0,4), ...rest(downs, 4, 'Otras bajas')];
  const pv = provNet[mi]-provNet[pi]; if(Math.abs(pv)>0.5) out.push({l:'Previsiones y reintegros', d:pv, note:'neto entre lo previsto y lo reintegrado', prev:true});
  return out;

    moved = h('div',{class:'row', style:'gap:14px'}, groupsU.map(([t,c,list,fn])=>h('div',{style:'flex:1 1 230px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)'}, h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'}, h('h3',{text:t}), st(c, String(list.length))), list.length? list.map(u=>h('div',{style:'font-size:13px'}, strong(u.uf), h('span',{class:'ink2 num', text:' · '+fn(u)}))) : h('div',{class:'muted', style:'font-size:13px', text:'Ninguna.'})))); }
  const ev = coefEvents.find(e=>e.mi===mi);
  return [kpis, h('div',{class:'row'}, h('div',{style:'flex:1 1 440px;min-width:0;display:flex'}, debt), h('div',{style:'flex:1 1 440px;min-width:0;display:flex'}, who)), hm,
    card(`Qué cambió en ${labM(P[mi])}`, mi? `Respecto de ${labM(P[mi-1])}.` : null, moved, ev? h('div',{class:'callout'}, h('span',{class:'tile serious'}, ic('alert')), h('span',{}, `${ev.changed.length} unidades cambiaron su coeficiente de prorrateo${ev.added.length? ` y se agregaron ${ev.added.map(u=>u.uf).join(', ')}` : ''}. `, h('button',{class:'lnk', style:'min-height:0;display:inline-flex', onclick:()=>go('revisar',{openControl:'coef'})}, 'Ver en Revisar', ic('arrow')))) : null)];
};

function tabFromHash(){ const k = (location.hash||'').replace('#',''); return TAB_DEFS.some(t=>t.k===k)? k : (OLD_TABS[k] || ''); }
{ let t = tabFromHash(); if(!t){ try{ t = localStorage.getItem('expensas-tab')||''; }catch(e){} } TAB = TAB_DEFS.some(x=>x.k===t)? t : 'resumen'; }
window.addEventListener('hashchange', ()=>{ const t = tabFromHash() || 'resumen'; if(t!==TAB){ TAB = t; render(); window.scrollTo(0,0); } });
if(window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener('change', renderTop);

// ---------- carga de datos: data.js (local) o data.enc cifrado con la clave compartida ----------
(async function(){
  const wrap = document.querySelector('.wrap'), gate = document.getElementById('gate'), form = document.getElementById('gate-form'), input = document.getElementById('gate-pw'), err = document.getElementById('gate-err');
  if(window.EXPENSAS){ bootDashboard(); return; }
  let buf = null;
  try{ const r = await fetch('data.enc', {cache:'no-store'}); if(r.ok) buf = await r.arrayBuffer(); }catch(e){}
  if(!buf || !(window.crypto && crypto.subtle)){ document.getElementById('subtitle').textContent = buf ? 'Este navegador no puede descifrar los datos (se necesita HTTPS).' : 'No se encontraron datos (data.js o data.enc). Ejecutá refresh.sh para generarlos.'; return; }
  const enc = new TextEncoder();
  async function decrypt(pw){
    const salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function attempt(pw, remember){
    try{ const data = await decrypt(pw); window.EXPENSAS = data; if(remember){ try{ localStorage.setItem('expensas-key', pw); }catch(e){} } gate.hidden = true; wrap.hidden = false; bootDashboard(); return true; }
    catch(e){ return false; }
  }
  let saved = null; try{ saved = localStorage.getItem('expensas-key'); }catch(e){}
  if(saved && await attempt(saved, false)) return;
  wrap.hidden = true; gate.hidden = false; input.focus();
  const eye = document.getElementById('gate-toggle'); eye.addEventListener('click', ()=>{ const show = input.type === 'password'; input.type = show? 'text' : 'password'; eye.setAttribute('aria-pressed', show? 'true' : 'false'); eye.setAttribute('aria-label', show? 'Ocultar clave' : 'Mostrar clave'); eye.title = eye.getAttribute('aria-label'); input.focus(); });
  form.addEventListener('submit', async ev=>{ ev.preventDefault(); err.textContent = ''; const btn = form.querySelector('button'); btn.disabled = true; const ok = await attempt(input.value.trim(), true); btn.disabled = false; if(!ok){ err.textContent = 'Clave incorrecta. Probá de nuevo.'; input.select(); } });
})();
</script>
